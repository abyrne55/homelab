# rumdl configuration file

[global]
# MD013 (line length) is impractical for infrastructure docs with long
# commands, URLs, and table cells.
disable = ["MD013"]
exclude = [
    ".git",
    ".github",
    ".claude/references",
    "node_modules",
    "vendor",
    "dist",
    "build",
    "CHANGELOG.md",
    "LICENSE.md",
]
