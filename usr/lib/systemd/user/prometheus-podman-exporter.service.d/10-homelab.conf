[Unit]
# Only start when per-user config file exists (created by tmpfiles for service users only)
ConditionPathExists=%h/.config/prometheus-podman-exporter
# Start after all quadlet containers. In each user's session only that user's
# services are in the transaction, so unrelated names are silently ignored.
After=caddy.service configarr.service gluetun.service home-assistant.service jellarr.service jellyfin.service matter-server.service mealie.service prowlarr.service qbittorrent.service radarr.service sonarr.service tinyproxy.service

[Service]
EnvironmentFile=-%h/.config/prometheus-podman-exporter

# Hardening: purely seccomp/prctl directives only.
# This service uses libpod directly (embedded, not via socket). libpod joins
# the rootless pause process's namespaces at init via setns(). Any systemd
# directive that creates a user namespace as a side effect (PrivateTmp,
# ProtectClock, ProtectKernelLogs, ProtectKernelModules, ProtectSystem,
# ProtectHome, ProtectHostname, ProtectControlGroups, PrivateUsers) breaks
# this by making /proc/<pause_pid>/ns/user inaccessible (EACCES). Similarly,
# RestrictNamespaces=yes blocks setns() directly. All such directives are
# intentionally omitted.
NoNewPrivileges=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_UNIX
UMask=0077
