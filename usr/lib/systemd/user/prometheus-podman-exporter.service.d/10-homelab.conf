[Unit]
# Only start when per-user config file exists (created by tmpfiles for service users only)
ConditionPathExists=%h/.config/prometheus-podman-exporter

[Service]
EnvironmentFile=-%h/.config/prometheus-podman-exporter

# Hardening directives disabled while establishing baseline functionality.
# Each will be re-enabled via additional drop-ins once confirmed working.
#NoNewPrivileges=yes
#PrivateTmp=yes
#PrivateUsers=yes
#ProtectHome=readonly
#ProtectSystem=strict
#ProtectControlGroups=yes
#ProtectHostname=yes
#ProtectKernelLogs=yes
#ProtectKernelModules=yes
#ProtectClock=yes
#ProtectProc=invisible
#LockPersonality=yes
#RestrictNamespaces=yes
#RestrictRealtime=yes
#RestrictSUIDSGID=yes
#SystemCallArchitectures=native
#RestrictAddressFamilies=AF_INET AF_UNIX
#UMask=0077
