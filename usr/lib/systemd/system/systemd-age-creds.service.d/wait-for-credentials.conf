[Unit]
# Don't start the service until credentials have been synced
After=homelab-secrets-sync.service
# Clear upstream /etc/age conditions, then set /var/lib paths
ConditionPathExists=
ConditionPathExists=/var/lib/age/identity.txt
ConditionDirectoryNotEmpty=
ConditionDirectoryNotEmpty=/var/lib/age/credentials

[Service]
Environment=AGE_IDENTITY=/var/lib/age/identity.txt
Environment=AGE_DIR=/var/lib/age/credentials
ReadWritePaths=/var/lib/age
