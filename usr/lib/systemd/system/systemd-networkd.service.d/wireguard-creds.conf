[Unit]
# Credentials are decrypted by systemd-age-creds, which needs the age identity
# from /var/lib/age/identity.txt. That file is written by secrets-inject (dev)
# or age-generate-identity (production). Start after whichever ran.
After=secrets-inject.service age-generate-identity.service

[Service]
LoadCredential=wg-nas-private-key:%t/systemd-age-creds.sock
LoadCredential=wg-nas-preshared-key:%t/systemd-age-creds.sock
