# Configure subordinate UID/GID ranges for rootless Podman containers
# These ranges allow rootless containers to map UIDs/GIDs in their namespace
# Allocation: each user gets 65536 subUIDs/GIDs to avoid conflicts with core (524288:65536)
#
# Note: systemd-tmpfiles only allows one directive per path, so all content must be in a single 'w' line

# All users with their subordinate UID/GID ranges
w /etc/subuid - - - - caddy:231072:65536\njellyfin:296608:65536\nqbittorrent:362144:65536\nradarr:427680:65536\nsonarr:493216:65536\nconfigarr:558752:65536\nprowlarr:624288:65536\nhome-assistant:689824:65536\nmealie:755360:65536\nllm:820896:65536\ncore:524288:65536\n
w /etc/subgid - - - - caddy:231072:65536\njellyfin:296608:65536\nqbittorrent:362144:65536\nqbittorrent:2000:1\nradarr:427680:65536\nradarr:2000:1\nsonarr:493216:65536\nsonarr:2000:1\nconfigarr:558752:65536\nprowlarr:624288:65536\nhome-assistant:689824:65536\nmealie:755360:65536\nllm:820896:65536\ncore:524288:65536\n
