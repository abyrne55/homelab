# Home directories for quadlet users with Podman subdirectories
d /var/home 0755 root root - -

# caddy home structure
# Note: 0755 permissions needed so rootless container can traverse and read Caddyfile
d /var/home/caddy 0755 caddy caddy - -
d /var/home/caddy/.local 0755 caddy caddy - -
d /var/home/caddy/.local/share 0755 caddy caddy - -
d /var/home/caddy/.local/share/containers 0755 caddy caddy - -
d /var/home/caddy/.config 0755 caddy caddy - -
d /var/home/caddy/.config/containers 0755 caddy caddy - -
d /var/home/caddy/caddy_etc 0755 caddy caddy - -

