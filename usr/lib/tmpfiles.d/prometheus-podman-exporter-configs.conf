# Per-user prometheus-podman-exporter configuration.
# 'f' creates the file only if it does not already exist.
# Each file sets PODMAN_EXPORTER_OPTS consumed by the homonymous user service.
# Port convention: last port in each user's 10-port block (X9).
f /var/home/caddy/.config/prometheus-podman-exporter           0600 caddy          caddy          - PODMAN_EXPORTER_OPTS=--collector.enable-all --web.listen-address=127.0.0.1:20519
