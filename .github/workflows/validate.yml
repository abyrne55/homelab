name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quadlets:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for quadlet changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            quadlets:
              - 'etc/containers/systemd/**'

      - name: Skip — no quadlet changes
        if: steps.changes.outputs.quadlets != 'true'
        run: echo "No quadlet changes detected, skipping validation"

      - name: Install podman
        if: steps.changes.outputs.quadlets == 'true'
        run: sudo apt-get install -y podman

      - name: Validate quadlet files
        if: steps.changes.outputs.quadlets == 'true'
        run: make verify-quadlets
