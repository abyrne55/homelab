name: reviewdog
on: [pull_request]
jobs:
  misspell:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: reviewdog/action-misspell@3467363dab5b42db2b1372c5fd2b1771fea2ea48 # v1.30.3
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          locale: "US"
          fail_level: warning
          # Vendored upstream docs; keep verbatim (British spellings etc.)
          exclude: |
            ./.claude/references/*
  actionlint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: reviewdog/action-actionlint@b76d06f8570118465db3190c9a08f1b29d341aa1 # v1.80.3
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          fail_level: warning
