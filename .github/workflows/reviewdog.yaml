name: reviewdog
on: [pull_request]
jobs:
  misspell:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: reviewdog/action-misspell@840bfbe9f804da9afb0bd739dc4689012f3fdd2d # v1.30.4
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          locale: "US"
          fail_level: warning
          # Vendored upstream docs; keep verbatim (British spellings etc.)
          exclude: |
            ./.claude/references/*
  actionlint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1.80.6
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
          fail_level: warning
