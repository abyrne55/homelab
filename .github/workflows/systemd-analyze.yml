name: systemd-analyze

on:
  pull_request:
    branches: ["*"]

jobs:
  systemd-analyze:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install podman
        run: sudo apt-get install -y podman

      - name: Verify and analyze systemd units
        run: make systemd-analyze-local
