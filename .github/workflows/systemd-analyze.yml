name: systemd-analyze

on:
  pull_request:
    branches: ["*"]

jobs:
  correctness-and-security:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for unit changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            units:
              - 'etc/containers/systemd/**'
              - 'usr/lib/systemd/**'

      - name: Skip — no unit changes
        if: steps.changes.outputs.units != 'true'
        run: echo "No systemd/quadlet changes detected, skipping analysis"

      - name: Install podman
        if: steps.changes.outputs.units == 'true'
        run: sudo apt-get install -y podman

      - name: Verify and analyze systemd units
        if: steps.changes.outputs.units == 'true'
        run: make systemd-analyze-local
