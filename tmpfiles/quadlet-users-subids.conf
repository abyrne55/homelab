# Configure subordinate UID/GID ranges for rootless Podman containers
# These ranges allow rootless containers to map UIDs/GIDs in their namespace
# Allocation: each user gets 65536 subUIDs/GIDs to avoid conflicts with core (524288:65536)

# testuser: 100000-165535
w+ /etc/subuid - - - - testuser:100000:65536\n
w+ /etc/subgid - - - - testuser:100000:65536\n

# testuser2: 165536-231071
w+ /etc/subuid - - - - testuser2:165536:65536\n
w+ /etc/subgid - - - - testuser2:165536:65536\n

# caddy: 231072-296607
w+ /etc/subuid - - - - caddy:231072:65536\n
w+ /etc/subgid - - - - caddy:231072:65536\n

# jellyfin: 296608-362143
w+ /etc/subuid - - - - jellyfin:296608:65536\n
w+ /etc/subgid - - - - jellyfin:296608:65536\n
